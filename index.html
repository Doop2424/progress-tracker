<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<script>
(function(){
  var p="system";
  try{ p=localStorage.getItem("pt-theme")||"system"; }catch(e){}
  var dark=p==="dark"||(p==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  window.__themePref=p;
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행현황 관리대장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  color-scheme:light;
  --ink:#111C2B; --ink2:#3A4A5F; --muted:#7A8A9E;
  --paper:#FFFFFF; --bg:#E9EDF2; --rule:#D3DBE4; --rule2:#E7ECF2; --hover:#F7F9FB;
  --brand:#1B4B7A; --brand-hover:#16406A; --brand-soft:#E4EDF6; --on-brand:#FFFFFF;
  --todo:#8A98A8; --doing:#B96C15; --done:#26714E; --danger:#B3402F;
  --todo-bg:#F2F4F7; --todo-bd:#DCE2E9;
  --doing-bg:#FBF2E6; --doing-bd:#EFD9BC;
  --done-bg:#EAF5EF; --done-bd:#BFDCCD;
  --late-bg:#FDECE9; --late-bd:#F0C9C1;
  --toast-bg:#111C2B; --toast-fg:#FFFFFF;
  --r:6px; --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E7EDF4; --ink2:#B7C3D1; --muted:#7B8B9D;
  --paper:#1A222C; --bg:#10161E; --rule:#2B3644; --rule2:#232D39; --hover:#212B37;
  --brand:#68AAE8; --brand-hover:#83BAEE; --brand-soft:#1C2F44; --on-brand:#0E1620;
  --todo:#8494A5; --doing:#DFA05A; --done:#54B58C; --danger:#E0705E;
  --todo-bg:#222C38; --todo-bd:#303C4A;
  --doing-bg:#332819; --doing-bd:#4B3A22;
  --done-bg:#17322A; --done-bd:#234A3B;
  --late-bg:#3A2020; --late-bd:#57302C;
  --toast-bg:#E7EDF4; --toast-fg:#101820;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none !important}

.btn{border:1px solid var(--rule); background:var(--paper); color:var(--ink2); padding:7px 13px;
  border-radius:var(--r); font-size:13px; font-weight:600; transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--brand); color:var(--brand)}
.btn:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover); border-color:var(--brand-hover); color:var(--on-brand)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted); padding:5px 8px}
.btn.ghost:hover{color:var(--danger)}
.btn.sm{padding:4px 9px; font-size:12px}
.fld{width:100%; border:1px solid var(--rule); background:var(--paper); padding:7px 9px; border-radius:var(--r); font-size:13px}
.fld:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
.lbl{display:block; font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--muted); margin-bottom:5px}

#gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
.gate-card{width:100%; max-width:360px; background:var(--paper); border:1px solid var(--rule); border-radius:10px; padding:28px}
.gate-card h1{font-size:19px; margin:0 0 4px} .gate-card p{margin:0 0 22px; color:var(--muted); font-size:12.5px}
.gate-card .row{margin-bottom:12px}
#gateErr{color:var(--danger); font-size:12.5px; min-height:18px; margin-top:10px}

header{background:var(--paper); border-bottom:1px solid var(--rule); position:sticky; top:0; z-index:30}
.hbar{max-width:1460px; margin:0 auto; padding:0 22px; display:flex; align-items:center; gap:16px; height:56px}
.brand{display:flex; flex-direction:column; line-height:1.15}
.brand .eyebrow{font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; color:var(--muted)}
.brand .name{font-size:15px; font-weight:800}
nav{display:flex; gap:2px; margin-left:auto}
.tab{border:none; background:transparent; padding:8px 13px; border-radius:var(--r); font-size:13px; font-weight:600; color:var(--muted)}
.tab:hover{color:var(--ink2); background:var(--bg)}
.tab.on{color:var(--brand); background:var(--brand-soft)}
.who{font-size:11.5px; color:var(--muted); padding-left:14px; border-left:1px solid var(--rule); display:flex; align-items:center; gap:10px}
main{max-width:1460px; margin:0 auto; padding:22px 22px 90px}

.seg{display:inline-flex; gap:2px; padding:2px; border:1px solid var(--rule); border-radius:20px; background:var(--bg)}
.seg button{border:none; background:transparent; border-radius:16px; padding:4px 12px; font-size:12px; font-weight:700; color:var(--muted)}
.seg button:hover{color:var(--ink2)}
.seg button.on{background:var(--paper); color:var(--ink)}

.view-head{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.view-head h2{font-size:17px; margin:0}
.view-head .sub{font-size:12.5px; color:var(--muted)}
.view-head .sp{margin-left:auto; display:flex; gap:8px; align-items:center}
.card{background:var(--paper); border:1px solid var(--rule); border-radius:9px}
.card-h{padding:12px 16px; border-bottom:1px solid var(--rule2); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.card-h h3{margin:0; font-size:13.5px; font-weight:700}
.card-b{padding:16px}
.empty{padding:38px 20px; text-align:center; color:var(--muted); font-size:13px}
.empty strong{display:block; color:var(--ink2); font-size:14px; margin-bottom:5px}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px}
.stat{background:var(--paper); border:1px solid var(--rule); border-radius:9px; padding:14px 16px}
.stat .k{font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--muted)}
.stat .v{font-size:26px; font-weight:800; letter-spacing:-.02em; margin-top:3px}
.stat .v small{font-size:13px; font-weight:600; color:var(--muted); margin-left:2px}

.strip{display:flex; gap:2px; height:9px; border-radius:3px; overflow:hidden; background:var(--rule2)}
.strip i{flex:1 1 0; min-width:3px; display:block; background:var(--todo)}
.strip i.doing{background:var(--doing)} .strip i.done{background:var(--done)} .strip i.late{background:var(--danger)}

.load{display:grid; grid-template-columns:92px 1fr 80px; gap:10px; align-items:center; padding:5px 0}
.load .nm{font-size:12.5px; font-weight:600; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.load .bar{height:16px; border-radius:4px; background:var(--rule2); overflow:hidden; display:flex}
.load .bar i{display:block; height:100%; background:var(--doing)}
.load .bar i.late{background:var(--danger)}
.load .n{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
.load .n b{color:var(--ink2)}

.co-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px}
.co-card{background:var(--paper); border:1px solid var(--rule); border-radius:9px; padding:16px; text-align:left; width:100%; display:block}
.co-card:hover{border-color:var(--brand)}
.co-card .top{display:flex; align-items:center; gap:8px; margin-bottom:3px}
.co-card .nm{font-size:15px; font-weight:700}
.co-card .pct{margin-left:auto; font-family:var(--mono); font-size:15px; font-weight:700; color:var(--brand)}
.co-card .meta{font-size:11.5px; color:var(--muted); margin-bottom:10px}
.co-card .counts{display:flex; gap:12px; margin-top:10px; font-size:11.5px; color:var(--muted)}
.co-card .counts b{color:var(--ink2)}
.runs{margin-top:11px; padding-top:10px; border-top:1px dashed var(--rule); display:flex; flex-direction:column; gap:5px}
.run{display:flex; align-items:center; gap:7px; font-size:12.5px; background:var(--doing-bg); border:1px solid var(--doing-bd); border-radius:5px; padding:4px 8px}
.run.late{background:var(--late-bg); border-color:var(--late-bd)}
.run .t{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink)}
.run .o{font-size:11px; color:var(--muted); flex:none}
.run .d{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--doing); flex:none}
.run.late .d{color:var(--danger)}
.run-none{font-size:12.5px; color:var(--muted); padding:4px 0}

.tag{display:inline-block; padding:1px 7px; border-radius:20px; font-size:10.5px; font-weight:700}
.tag.late{color:var(--danger); background:var(--late-bg); border:1px solid var(--late-bd)}
.tag.stale{color:var(--doing); background:var(--doing-bg); border:1px solid var(--doing-bd)}
.tag.tpl{color:var(--brand); background:var(--brand-soft); border:1px solid var(--brand-soft)}

.tbl-wrap{overflow:auto}
table{width:100%; border-collapse:collapse}
th{text-align:left; font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--muted);
   padding:9px 8px; border-bottom:1px solid var(--rule); white-space:nowrap; background:var(--paper)}
td{padding:5px 8px; border-bottom:1px solid var(--rule2); vertical-align:middle}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--brand-soft)}
td.num{font-family:var(--mono); font-size:11.5px; color:var(--muted); width:36px}
td.co{font-weight:600; white-space:nowrap; font-size:12.5px}
.sub2{font-size:11px; color:var(--muted); font-weight:500}
.mono{font-family:var(--mono); font-size:12px}
.cell-in{border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:5px; width:100%; font-size:13px}
.cell-in:hover{border-color:var(--rule2)}
.cell-in:focus{outline:none; border-color:var(--brand); background:var(--paper); box-shadow:0 0 0 3px var(--brand-soft)}
input[type=date].cell-in{font-family:var(--mono); font-size:11.5px; padding:4px 4px}
select.st{border:1px solid var(--rule); border-radius:20px; padding:3px 6px; font-size:11.5px; font-weight:700; appearance:none; text-align:center; min-width:70px}
select.st.todo{color:var(--todo); border-color:var(--todo-bd); background:var(--todo-bg)}
select.st.doing{color:var(--doing); border-color:var(--doing-bd); background:var(--doing-bg)}
select.st.done{color:var(--done); border-color:var(--done-bd); background:var(--done-bg)}
.badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700}
.badge.todo{color:var(--todo); background:var(--todo-bg)}
.badge.doing{color:var(--doing); background:var(--doing-bg)}
.badge.done{color:var(--done); background:var(--done-bg)}
.dd{font-family:var(--mono); font-size:11.5px; font-weight:700}
.dd.late{color:var(--danger)} .dd.soon{color:var(--doing)} .dd.far{color:var(--muted)}

/* 담당자 복수 */
.own{border:1px solid var(--rule2); background:transparent; border-radius:5px; padding:4px 8px; font-size:12px;
  width:100%; text-align:left; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.own:hover{border-color:var(--brand); color:var(--brand)}
.own.none{color:var(--muted)}
#ownPop{position:fixed; z-index:80; background:var(--paper); border:1px solid var(--rule); border-radius:9px;
  box-shadow:0 10px 28px rgba(0,0,0,.18); min-width:186px; overflow:hidden}
#ownPop .pop-h{font-size:11px; font-weight:700; color:var(--muted); padding:9px 12px 7px; border-bottom:1px solid var(--rule2)}
#ownPop .pop-b{padding:6px; max-height:230px; overflow-y:auto}
#ownPop label{display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:5px; font-size:13px; cursor:pointer}
#ownPop label:hover{background:var(--hover)}
#ownPop input[type=checkbox]{width:15px; height:15px; accent-color:var(--brand); margin:0}
#ownPop .pop-f{display:flex; gap:6px; padding:8px; border-top:1px solid var(--rule2); background:var(--bg)}
#ownPop .pop-f.alt{padding-bottom:0; background:var(--bg)}
#ownPop .pop-f button{flex:1; border:1px solid var(--rule); background:var(--paper); border-radius:5px; padding:5px 6px; font-size:12px; font-weight:600; color:var(--ink2)}
#ownPop .pop-f button:hover:not([disabled]){border-color:var(--brand); color:var(--brand)}
#ownPop .pop-f button[disabled]{opacity:.4; cursor:default}
#ownPop .pop-f button[data-close]{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
#ownPop .none{font-size:11.5px; color:var(--muted); padding:14px}

/* 일괄 편집 바 */
#bulk{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:55;
  background:var(--paper); border:1px solid var(--brand); border-radius:30px; padding:8px 12px;
  display:flex; align-items:center; gap:8px; box-shadow:0 8px 26px rgba(0,0,0,.18); flex-wrap:wrap; max-width:94vw}
#bulk .cntx{font-size:12.5px; font-weight:700; color:var(--brand); padding:0 6px}
#bulk select,#bulk input{border:1px solid var(--rule); border-radius:16px; padding:5px 9px; font-size:12px; background:var(--paper)}

.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding:14px 16px; border-bottom:1px solid var(--rule2)}
.filters .f{min-width:132px}
.chips{display:flex; gap:5px}
.chip{border:1px solid var(--rule); background:var(--paper); border-radius:20px; padding:5px 12px; font-size:12px; font-weight:600; color:var(--muted)}
.chip.on{border-color:var(--brand); background:var(--brand-soft); color:var(--brand)}
.chip.on.red{border-color:var(--late-bd); background:var(--late-bg); color:var(--danger)}

.mx{border-collapse:separate; border-spacing:0; width:auto; min-width:100%}
.mx th.cx{position:sticky; left:0; z-index:5; background:var(--paper); border-right:1px solid var(--rule); min-width:172px}
.mx td.cx{position:sticky; left:0; z-index:4; background:var(--paper); border-right:1px solid var(--rule); font-weight:600; white-space:nowrap}
.mx tbody tr:hover td.cx{background:var(--hover)}
.mx th{vertical-align:bottom; font-size:10.5px; max-width:80px; white-space:normal; line-height:1.3; text-align:center}
.mx td.cell{text-align:center; padding:4px 3px}
.mx .dot{display:inline-flex; align-items:center; justify-content:center; width:100%; min-width:34px; height:24px;
  border-radius:5px; font-size:10.5px; font-weight:700; border:1px solid transparent}
.dot.todo{background:var(--todo-bg); border-color:var(--todo-bd); color:var(--todo)}
.dot.doing{background:var(--doing-bg); border-color:var(--doing-bd); color:var(--doing)}
.dot.done{background:var(--done-bg); border-color:var(--done-bd); color:var(--done)}
.dot.late{background:var(--late-bg); border-color:var(--late-bd); color:var(--danger)}
.dot.na{color:var(--rule); font-weight:400}

.gantt{overflow-x:auto; padding-bottom:6px}
.gt-row{display:flex; align-items:stretch; border-bottom:1px solid var(--rule2)}
.gt-name{position:sticky; left:0; z-index:6; background:var(--paper); border-right:1px solid var(--rule);
  width:178px; min-width:178px; padding:8px 12px; font-size:12.5px; font-weight:600; display:flex; flex-direction:column; justify-content:center}
.gt-name .sub2{font-weight:500}
.gt-track{position:relative; flex:1}
.gt-head{border-bottom:1px solid var(--rule)}
.gt-head .gt-name{font-size:11px; color:var(--muted); font-weight:700}
.gt-head .gt-track{height:26px}
.gt-mo{position:absolute; top:0; bottom:0; border-left:1px solid var(--rule2)}
.gt-mo.alt{background:var(--rule2); opacity:.55}
.gt-head .gt-mo{opacity:1; display:flex; align-items:center; justify-content:center}
.gt-head .gt-mo.alt{background:var(--rule2)}
.gt-head .gt-mo span{font-size:11.5px; font-weight:700; color:var(--ink2)}
.gt-head .gt-mo b{font-family:var(--mono); font-size:9.5px; color:var(--muted); font-weight:700}
.gt-today{position:absolute; top:0; bottom:0; width:2px; background:var(--danger); opacity:.6; z-index:3}
.gt-bar{position:absolute; height:19px; border-radius:9px; padding:0 8px; font-size:11px; font-weight:600;
  display:flex; align-items:center; white-space:nowrap; overflow:hidden; border:1px solid; z-index:2}
.gt-bar.todo{background:var(--todo-bg); border-color:var(--todo-bd); color:var(--ink2)}
.gt-bar.doing{background:var(--doing-bg); border-color:var(--doing-bd); color:var(--doing)}
.gt-bar.done{background:var(--done-bg); border-color:var(--done-bd); color:var(--done)}
.gt-bar.late{background:var(--late-bg); border-color:var(--late-bd); color:var(--danger)}
.gt-lbl{position:absolute; height:19px; display:flex; align-items:center; font-size:11px; color:var(--ink2); white-space:nowrap; z-index:2}

.board{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; align-items:flex-start}
.bcol{flex:0 0 268px; background:var(--paper); border:1px solid var(--rule); border-radius:9px}
.bcol h4{margin:0; padding:11px 14px; font-size:12.5px; border-bottom:1px solid var(--rule2); display:flex; gap:8px; align-items:center}
.bcol h4 span.c{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted)}
.bcol .body{padding:10px; display:flex; flex-direction:column; gap:8px; max-height:62vh; overflow-y:auto}
.bcard{border:1px solid var(--rule); border-left:3px solid var(--doing); border-radius:6px; padding:9px 11px; background:var(--paper); text-align:left; width:100%}
.bcard:hover{border-color:var(--brand)}
.bcard.late{border-left-color:var(--danger)}
.bcard .c{font-size:11px; color:var(--muted); font-weight:600}
.bcard .s{font-size:13px; font-weight:600; margin:2px 0 6px}
.bcard .m{display:flex; gap:8px; align-items:center}

.split{display:grid; grid-template-columns:290px 1fr; gap:14px; align-items:start}
.side-co{padding:9px 14px 5px; font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--muted);
  display:flex; align-items:center; gap:6px; border-top:1px solid var(--rule2)}
.side-co .acts{margin-left:auto; display:flex; gap:2px}
.side-co .acts button{border:none; background:transparent; color:var(--muted); font-size:11px; padding:2px 4px}
.side-co .acts button:hover{color:var(--brand)}
.side-item{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 14px 8px 22px;
  border:none; background:transparent; font-size:13px}
.side-item:hover{background:var(--hover)}
.side-item.on{background:var(--brand-soft); color:var(--brand); font-weight:700; box-shadow:inset 3px 0 0 var(--brand)}
.side-item .mini{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted)}
.side-item.on .mini{color:var(--brand)}
.mem-item{display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--rule2); font-size:13px}
.mem-item .mini{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted)}
.mem-item button{border:none; background:transparent; color:var(--muted); font-size:11px; padding:2px 4px}
.mem-item button:hover{color:var(--brand)}

.step-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--rule2); flex-wrap:wrap}
.step-row .idx{font-family:var(--mono); font-size:11px; color:var(--muted); width:24px; flex:none}
.mv{display:flex; flex-direction:column; gap:1px; flex:none}
.mv button{border:none; background:transparent; color:var(--muted); font-size:9px; line-height:1; padding:2px 4px}
.mv button:hover{color:var(--brand)}
.addbar{display:flex; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--rule); flex-wrap:wrap; align-items:center}
.hint{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.6}
.mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px}

#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(70px);
  background:var(--toast-bg); color:var(--toast-fg); padding:9px 18px; border-radius:20px; font-size:12.5px;
  font-weight:600; opacity:0; transition:opacity .18s,transform .18s; pointer-events:none; z-index:90}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* 보고서 */
.rep{background:var(--paper); border:1px solid var(--rule); border-radius:9px; padding:26px 30px}
.rep-h{display:flex; align-items:flex-end; gap:14px; border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:14px}
.rep-h h3{margin:0; font-size:19px; letter-spacing:-.01em}
.rep-h .meta{margin-left:auto; text-align:right; font-size:11.5px; color:var(--muted); line-height:1.55}
.rep-sec{font-size:13px; font-weight:800; margin:22px 0 8px; padding-left:9px; border-left:3px solid var(--brand)}
.rep table{font-size:12px; table-layout:fixed}
.rep .rep-proj table td:nth-child(2),.rep .rep-proj table td:nth-child(6){white-space:normal; word-break:keep-all}
.rep th{font-size:10.5px; padding:6px 8px; background:var(--bg)}
.rep td{padding:5px 8px}
.rep tbody tr:hover{background:transparent}
.rn{text-align:right; font-family:var(--mono); font-size:11.5px}
.rep-grp{margin-top:16px}
.rep-grp h4{margin:0 0 8px; font-size:14px; display:flex; align-items:center; gap:8px}
.rep-grp h4 .c{font-size:11px; color:var(--muted); font-weight:600}
.rep-proj{border:1px solid var(--rule); border-radius:7px; padding:12px 14px; margin-bottom:10px; break-inside:avoid; page-break-inside:avoid}
.rep-proj .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:7px}
.rep-proj .nm{font-size:14px; font-weight:700}
.rep-proj .pct{margin-left:auto; font-family:var(--mono); font-weight:700; color:var(--brand)}
.rep-proj .now{font-size:12px; color:var(--ink2); margin:8px 0 7px; display:flex; gap:16px; flex-wrap:wrap}
.rep-proj .now b{color:var(--ink)}
.tent{color:var(--muted); font-style:italic}
.tent::after{content:" 예정"; font-size:10px; font-style:normal}

/* 캘린더 */
.cal-tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.cal-ym{font-size:16px; font-weight:800; min-width:112px; text-align:center}
.cal{border:1px solid var(--rule); border-radius:9px; overflow:hidden; background:var(--paper)}
.cal-dow{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--rule)}
.cal-dow div{padding:7px 0; text-align:center; font-size:11px; font-weight:700; color:var(--muted)}
.cal-dow div:first-child{color:var(--danger)} .cal-dow div:last-child{color:var(--brand)}
.cal-wk{position:relative; display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--rule2)}
.cal-wk:last-child{border-bottom:none}
.cal-d{border-right:1px solid var(--rule2); padding:4px 6px}
.cal-d:last-child{border-right:none}
.cal-d.out{background:var(--bg)} .cal-d.out .n{opacity:.45}
.cal-d.we{background:var(--hover)}
.cal-d .n{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--muted)}
.cal-d.today .n{background:var(--brand); color:var(--on-brand); border-radius:10px; padding:0 6px}
.cal-ev{position:absolute; height:20px; border-radius:4px; font-size:11px; font-weight:600; display:flex; align-items:center; gap:4px;
  padding:0 6px; white-space:nowrap; overflow:hidden; border:1px solid; cursor:pointer; z-index:2; text-align:left}
.cal-ev .t{overflow:hidden; text-overflow:ellipsis}
.cal-ev .o{font-family:var(--mono); font-size:10px; opacity:.85; margin-left:auto; flex:none}
.cal-ev.tent{border-style:dashed; background:var(--paper) !important}

.cal-ev.late{box-shadow:inset 0 0 0 1px var(--danger)}

.cal-leg{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--ink2); margin-top:10px}
.cal-leg i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid}

<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDgYYLiDXVJiqDdtb25AvsdtR1hUxPBV2Y",
  authDomain: "worklog-4445b.firebaseapp.com",
  projectId: "worklog-4445b",
  storageBucket: "worklog-4445b.firebasestorage.app",
  messagingSenderId: "763693345629",
  appId: "1:763693345629:web:1d73c1b2e1ed960f7416b4"
};
const COLLECTION = "projectTracker";
const STALE_DAYS = 7;

let auth = null, db = null, READY = false, INIT_ERR = "";
(function(){
  if (typeof firebase === "undefined"){ INIT_ERR = "Firebase SDK를 불러오지 못했습니다. 실제 호스팅 주소에서 열어주세요."; return; }
  const bad = Object.entries(firebaseConfig).filter(([, v]) => !v || String(v).includes("붙여넣기")).map(([k]) => k);
  if (bad.length){ INIT_ERR = "Firebase 설정 미입력: " + bad.join(", "); return; }
  try { firebase.initializeApp(firebaseConfig); auth = firebase.auth(); db = firebase.firestore(); READY = true; }
  catch(e){ INIT_ERR = "Firebase 초기화 실패: " + (e.code || e.message); }
})();

/* ===== 상태 ===== */
const S = {todo:"미착수", doing:"진행중", done:"완료"};
const ABBR = {todo:"○", doing:"◐", done:"●"};
let DB = {companies:[], projects:[], templates:[], members:[], cats:[]};
let uid = null, docRef = null, unsub = null;
let view = "dash", sub = "sum", selProj = null, selTpl = null, hideDone = false;
let dash = {co:"", cat:""};              // 현황판 공통 필터
let filters = {co:"", cat:"", tpl:"", owner:"", key:"", sort:"co", status:{todo:true, doing:true, done:true}, lateOnly:false};
let picked = new Set();          // 진행표 선택 (projId|stepId)

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 86400000;

const todayStr = () => { const d = new Date(); d.setHours(0,0,0,0);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const toD = s => { if (!isDate(s)) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fromD = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const addDays = (s, n) => { const d = toD(s); if (!d) return ""; d.setDate(d.getDate() + n); return fromD(d); };
const diffDays = (a, b) => Math.round((toD(a) - toD(b)) / DAY);
const md = s => isDate(s) ? s.slice(5).replace("-", "/") : "";

const stOf = s => s.status || "todo";
const ownersOf = s => Array.isArray(s.owners) ? s.owners : (s.owner ? [s.owner] : []);
const dueOf = s => s.end || s.start || "";
const isLate = s => stOf(s) !== "done" && isDate(dueOf(s)) && diffDays(dueOf(s), todayStr()) < 0;
const staleDays = s => (stOf(s) === "doing" && isDate(s.startedAt)) ? diffDays(todayStr(), s.startedAt) : null;
const ddText = s => {
  const due = dueOf(s);
  if (!isDate(due)) return {t:"–", c:"far"};
  if (stOf(s) === "done") return {t:"완료", c:"far"};
  const n = diffDays(due, todayStr());
  if (n < 0) return {t:"D+" + (-n), c:"late"};
  if (n === 0) return {t:"D-DAY", c:"late"};
  return {t:"D-" + n, c:n <= 7 ? "soon" : "far"};
};
const periodText = s => (s.start && s.end && s.start !== s.end) ? (md(s.start) + "~" + md(s.end)) : (md(dueOf(s)) || "–");

const coOf = id => DB.companies.find(c => c.id === id) || null;
const coName = id => (coOf(id) || {name:"(삭제된 회사)"}).name;
const tplOf = id => DB.templates.find(t => t.id === id) || null;
const tplName = id => (tplOf(id) || {name:"절차 미지정"}).name;
const projOf = id => DB.projects.find(p => p.id === id) || null;
const projTitle = p => coName(p.coId) + (p.period ? " · " + p.period : "");
const visProjects = () => DB.projects.filter(p => (!hideDone || cnt(p).pct < 100)
  && (!dash.co || p.coId === dash.co) && (!dash.cat || catLabel(p) === dash.cat));

/* ===== 프로젝트 구분 ===== */
const DEFAULT_CATS = ["회계감사", "내부회계", "내부회계 고도화", "XBRL 작성", "기타"];
const guessCat = name => { const n = name || "";
  if (/xbrl/i.test(n)) return "XBRL 작성"; if (/고도화/.test(n)) return "내부회계 고도화";
  if (/내부회계/.test(n)) return "내부회계"; if (/감사|검토/.test(n)) return "회계감사"; return ""; };
const catOf = p => p.cat || (tplOf(p.tplId) || {}).cat || "";
const catLabel = p => catOf(p) || "미분류";
const catList = () => { const s = new Set(DB.cats || []); DB.templates.forEach(t => { if (t.cat) s.add(t.cat); }); DB.projects.forEach(p => { if (p.cat) s.add(p.cat); }); return Array.from(s); };
const projOwners = p => { const o = []; (p.steps || []).forEach(s => ownersOf(s).forEach(x => { if (!o.includes(x)) o.push(x); })); return o; };

/* ===== 임시 일정(비고의 "예정: 9월말" 등) 해석 ===== */
const parseTent = memo => {
  const m = /(\d{1,2})\s*월\s*(초|중순|중|말|첫\s*주|둘째\s*주|셋째\s*주|넷째\s*주|마지막\s*주)?/.exec(memo || "");
  if (!m) return null;
  const mo = +m[1]; if (mo < 1 || mo > 12) return null;
  const t = toD(todayStr()); let y = t.getFullYear();
  if (mo < t.getMonth() + 1 - 2) y++;                       // 두 달 넘게 지난 달이면 내년으로 본다
  const last = new Date(y, mo, 0).getDate();
  let a = 1, b = last; const q = (m[2] || "").replace(/\s/g, "");
  if (q === "초" || q === "첫주"){ a = 1; b = 10; }
  else if (q === "중" || q === "중순"){ a = 11; b = 20; }
  else if (q === "말" || q === "마지막주"){ a = 21; b = last; }
  else if (q === "둘째주"){ a = 8; b = 14; } else if (q === "셋째주"){ a = 15; b = 21; } else if (q === "넷째주"){ a = 22; b = 28; }
  const f = d => y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  return {start:f(a), end:f(b), tent:true};
};
// 확정 일정(시작·종료일) 우선, 없으면 비고에서 임시 일정 해석. 완료 단계는 확정 일정만.
const schedOf = s => {
  if (isDate(dueOf(s))) return {start:isDate(s.start) ? s.start : dueOf(s), end:dueOf(s), tent:false};
  if (stOf(s) === "done") return null;
  return parseTent(s.memo);
};
const schedText = sc => !sc ? "–" : (sc.start !== sc.end ? md(sc.start) + "~" + md(sc.end) : md(sc.end));

/* 담당자 1글자 약칭 (성 겹치면 2글자) */
function initialsMap(){
  const cnt = {}; DB.members.forEach(m => { const k = [...m][0] || ""; cnt[k] = (cnt[k] || 0) + 1; });
  const map = {}; DB.members.forEach(m => { const c = [...m]; map[m] = cnt[c[0]] > 1 ? c.slice(0, 2).join("") : c[0]; });
  return map;
}
const initials = list => { const mp = initialsMap(); return list.map(o => mp[o] || [...o][0] || "").join("·"); };

/* 회사별 색상 */
const HUES = [210, 150, 28, 280, 0, 180, 60, 320, 100, 240, 20, 170];
function coColor(i){
  const h = HUES[i % HUES.length], dark = document.documentElement.dataset.theme === "dark";
  return dark ? {bg:`hsl(${h} 35% 24%)`, bd:`hsl(${h} 35% 42%)`, fg:`hsl(${h} 70% 82%)`}
              : {bg:`hsl(${h} 60% 92%)`, bd:`hsl(${h} 45% 72%)`, fg:`hsl(${h} 60% 26%)`};
}

let localKey = "";
const snapKey = d => JSON.stringify([d.companies, d.projects, d.templates, d.members, d.cats]);

function migrate(){
  let ch = false;
  if (!Array.isArray(DB.projects)){ DB.projects = []; ch = true; }
  if (!Array.isArray(DB.members)){ DB.members = []; ch = true; }
  if (!Array.isArray(DB.cats) || !DB.cats.length){ DB.cats = DEFAULT_CATS.slice(); ch = true; }
  DB.templates.forEach(t => { if (t.cat === undefined){ t.cat = guessCat(t.name); ch = true; } });
  DB.projects.forEach(p => { if (p.cat === undefined){ p.cat = ""; ch = true; } });

  // v2(회사에 단계 직접 보유) → v3(프로젝트 계층)
  DB.companies.forEach(c => {
    if (Array.isArray(c.steps)){
      const p = {id:uid8(), coId:c.id, tplId:c.tplId || "", period:"", steps:c.steps};
      DB.projects.push(p); delete c.steps; delete c.tplId; ch = true;
    }
  });
  DB.projects.forEach(p => {
    if (p.period === undefined){ p.period = ""; ch = true; }
    if (p.tplId === undefined){ p.tplId = ""; ch = true; }
    (p.steps || []).forEach(s => {
      if ("plan" in s){ if (isDate(s.plan)) s.end = s.plan; else if (s.plan) s.memo = (s.memo ? s.memo + " / " : "") + "예정:" + s.plan; delete s.plan; ch = true; }
      if ("due" in s){ if (!s.end) s.end = s.due; delete s.due; ch = true; }
      if (s.start === undefined){ s.start = ""; ch = true; }
      if (s.end === undefined){ s.end = ""; ch = true; }
      if (!Array.isArray(s.owners)){ s.owners = s.owner ? [s.owner] : []; delete s.owner; ch = true; }
      s.owners.forEach(o => { if (o && !DB.members.includes(o)){ DB.members.push(o); ch = true; } });
    });
  });
  DB.templates.forEach(t => (t.steps || []).forEach(s => {
    if ("plan" in s){ const n = parseInt(s.plan, 10); if (!isNaN(n)) s.offset = n; delete s.plan; ch = true; }
    if (s.offset === undefined){ s.offset = ""; ch = true; }
    if (s.dur === undefined){ s.dur = ""; ch = true; }
  }));
  return ch;
}

function listen(){
  unsub = docRef.onSnapshot(snap => {
    const d = snap.data() || {};
    const inc = {companies:d.companies || [], projects:d.projects || [], templates:d.templates || [], members:d.members || [], cats:d.cats || []};
    const key = snapKey(inc);
    // 저장 대기 중이거나 쓰기 응답이 아직 오지 않았으면, 서버 데이터로 덮어쓰지 않는다
    if (snap.metadata.hasPendingWrites || saveT || inflight > 0) return;
    if (key === localKey) return;
    DB = inc; localKey = key;
    if (migrate()) save(true);
    if (selProj && !projOf(selProj)) selProj = null;
    if (selTpl && !tplOf(selTpl)) selTpl = null;
    render();
  }, e => toast("불러오기 실패: " + e.code));
}

let saveT = null, inflight = 0;
function save(now){
  if (!docRef) return;
  clearTimeout(saveT); saveT = null;
  const write = () => {
    saveT = null;
    localKey = snapKey(DB);
    inflight++;
    docRef.set({companies:DB.companies, projects:DB.projects, templates:DB.templates, members:DB.members, cats:DB.cats || [],
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()}, {merge:true})
      .catch(e => toast("저장 실패: " + e.code))
      .finally(() => { inflight = Math.max(0, inflight - 1); });
  };
  now ? write() : (saveT = setTimeout(write, 900));
}
window.addEventListener("beforeunload", () => { if (saveT){ clearTimeout(saveT); save(true); } });

/* ===== 집계 ===== */
function cnt(p){
  const s = p.steps || [], r = {all:s.length, todo:0, doing:0, done:0, late:0};
  s.forEach(x => { r[stOf(x)]++; if (isLate(x)) r.late++; });
  r.pct = s.length ? Math.round(r.done / s.length * 100) : 0;
  return r;
}
const running = p => (p.steps || []).filter(s => stOf(s) === "doing");

function groupByTpl(list){
  const g = new Map();
  list.forEach(p => { const id = tplOf(p.tplId) ? p.tplId : ""; if (!g.has(id)) g.set(id, []); g.get(id).push(p); });
  return Array.from(g.entries()).sort((a, b) => (a[0] === "" ? 1 : 0) - (b[0] === "" ? 1 : 0));
}
function colsFor(tid, list){
  const t = tplOf(tid);
  if (t) return (t.steps || []).map(s => s.name);
  const seen = [];
  list.forEach(p => (p.steps || []).forEach(s => { if (!seen.includes(s.name)) seen.push(s.name); }));
  return seen;
}

function dashSummary(){
  const ps = visProjects();
  const t = {all:0, doing:0, done:0, late:0};
  ps.forEach(p => { const k = cnt(p); t.all += k.all; t.doing += k.doing; t.done += k.done; t.late += k.late; });
  const pct = t.all ? Math.round(t.done / t.all * 100) : 0;
  const stats = [
    ["진행 프로젝트", ps.length + "<small>건</small>"],
    ["동시 진행중 단계", `<span style="color:var(--doing)">${t.doing}</span><small>건</small>`],
    ["지연", `<span style="color:${t.late ? "var(--danger)" : "inherit"}">${t.late}</span><small>건</small>`],
    ["전체 완료율", pct + "<small>%</small>"]
  ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

  const load = {};
  ps.forEach(p => running(p).forEach(s => {
    const os = ownersOf(s); (os.length ? os : ["미지정"]).forEach(o => {
      load[o] = load[o] || {n:0, late:0}; load[o].n++; if (isLate(s)) load[o].late++;
    });
  }));
  const owners = Object.entries(load).sort((a, b) => b[1].n - a[1].n);
  const max = owners.length ? owners[0][1].n : 1;
  const loadHtml = owners.length ? owners.map(([o, v]) => `
    <div class="load"><span class="nm">${esc(o)}</span>
      <span class="bar"><i class="late" style="width:${v.late / max * 100}%"></i><i style="width:${(v.n - v.late) / max * 100}%"></i></span>
      <span class="n"><b>${v.n}</b>건${v.late ? ` · <span style="color:var(--danger)">지연 ${v.late}</span>` : ""}</span></div>`).join("")
    : `<div class="empty" style="padding:18px">진행중인 단계가 없습니다.</div>`;

  const cards = ps.length ? ps.map(p => {
    const k = cnt(p), runs = running(p);

    const runHtml = runs.length ? runs.map(s => {

        ${os.length ? `<span class="o">${esc(os.join("·"))}</span>` : ""}
        ${sd !== null && sd >= STALE_DAYS ? `<span class="tag stale">${sd}일째</span>` : ""}
        <span class="d">${d.t}</span></div>`;
    }).join("") : `<div class="run-none">진행중인 단계 없음</div>`;
    return `<button class="co-card" data-goproj="${p.id}">
      <div class="top"><span class="nm">${esc(coName(p.coId))}</span>
        ${k.late ? `<span class="tag late">지연 ${k.late}</span>` : ""}<span class="pct">${k.pct}%</span></div>
      <div class="meta">${esc(catLabel(p))} · ${esc(p.period || "기수 미지정")} · ${esc(tplName(p.tplId))}</div>
      <div class="strip">${strip}</div>
      <div class="counts"><span>완료 <b>${k.done}</b></span><span>진행중 <b>${k.doing}</b></span><span>미착수 <b>${k.todo}</b></span><span>총 <b>${k.all}</b></span></div>
      <div class="runs">${runHtml}</div></button>`;
  }).join("") : `<div class="card"><div class="empty"><strong>프로젝트가 없습니다</strong>기준정보에서 절차 템플릿을 만들고, 프로젝트 탭에서 회사와 프로젝트를 등록하세요.</div></div>`;

  $("#dashBody").innerHTML = `<div class="stats">${stats}</div>

function dashMatrix(){

    const rows = list.map(p => {
      const by = {}; (p.steps || []).forEach(s => { if (!by[s.name]) by[s.name] = s; });
      const k = cnt(p);
      const extra = (p.steps || []).filter(s => !cols.includes(s.name)).length;
      const cells = cols.map(n => {
        const s = by[n];

      }).join("");
      return `<tr><td class="cx">${esc(coName(p.coId))}<br><span class="sub2">${esc(p.period || "기수 미지정")}</span>

    }).join("");

    ○ 미착수 · ◐ 진행중 · ● 완료 · 붉은색 = 기한 초과 · <b>·</b> = 해당 단계 없음 · <b>+N</b> = 템플릿 외 개별 단계
  </div></div>`;

function dashGantt(){
  const ps = visProjects().filter(p => (p.steps || []).some(s => isDate(dueOf(s))));
  if (!ps.length){ $("#dashBody").innerHTML = `<div class="card"><div class="empty"><strong>일정이 입력된 단계가 없습니다</strong>프로젝트 탭에서 시작일·종료일을 지정하면 타임라인이 그려집니다.</div></div>`; return; }
  const today = todayStr();
  let min = today, max = today;
  ps.forEach(p => (p.steps || []).forEach(s => {
    const a = isDate(s.start) ? s.start : dueOf(s), b = dueOf(s);
    if (isDate(a) && a < min) min = a;
    if (isDate(b) && b > max) max = b;
  }));

  // 월 그리드 (앞뒤 한 달 여유)
  const MW = 118;
  const d0 = toD(min), d1 = toD(max);
  const first = new Date(d0.getFullYear(), d0.getMonth() - 1, 1);
  const last  = new Date(d1.getFullYear(), d1.getMonth() + 1, 1);
  const months = [];
  for (let d = new Date(first); d <= last; d.setMonth(d.getMonth() + 1))
    months.push({y:d.getFullYear(), m:d.getMonth(), days:new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()});
  const W = months.length * MW;
  const xOf = str => {
    const d = toD(str); if (!d) return 0;
    const i = (d.getFullYear() - months[0].y) * 12 + (d.getMonth() - months[0].m);
    if (i < 0) return 0;
    if (i >= months.length) return W;
    return i * MW + ((d.getDate() - 1) / months[i].days) * MW;
  };
  const grid = months.map((mo, i) => `<div class="gt-mo${i % 2 ? " alt" : ""}" style="left:${i * MW}px;width:${MW}px"></div>`).join("");
  const head = months.map((mo, i) => `<div class="gt-mo${i % 2 ? " alt" : ""}" style="left:${i * MW}px;width:${MW}px">
      <span>${(mo.m === 0 || i === 0) ? `<b>${String(mo.y).slice(2)}</b> ` : ""}${mo.m + 1}월</span></div>`).join("");
  const todayX = xOf(today);

  const rows = ps.map(p => {
    const list = (p.steps || []).filter(s => isDate(dueOf(s))).map(s => {
      const a = isDate(s.start) ? s.start : dueOf(s), b = dueOf(s);
      const x = xOf(a);
      const w = Math.max(9, xOf(b) + MW / 31 - x);
      const label = [...s.name].length > 14 ? [...s.name].slice(0, 14).join("") + "…" : s.name;
      const inside = w >= 16 + [...label].length * 10.5;
      return {s, x, w, label, inside, lw:inside ? 0 : 10 + [...label].length * 10.5};
    }).sort((a, b) => a.x - b.x);
    const lanes = [];
    list.forEach(it => {
      let li = lanes.findIndex(e => e <= it.x);
      if (li === -1){ lanes.push(0); li = lanes.length - 1; }
      lanes[li] = it.x + it.w + it.lw + 8; it.lane = li;
    });
    const bars = list.map(it => {
      const cls = isLate(it.s) ? "late" : stOf(it.s);
      const top = it.lane * 25 + 8;
      const tip = `${esc(it.s.name)} · ${S[stOf(it.s)]} · ${periodText(it.s)}${ownersOf(it.s).length ? " · " + esc(ownersOf(it.s).join("·")) : ""}`;
      return `<div class="gt-bar ${cls}" style="left:${it.x}px;top:${top}px;width:${it.w}px" title="${tip}">${it.inside ? esc(it.label) : ""}</div>`
        + (it.inside ? "" : `<div class="gt-lbl" style="left:${it.x + it.w + 4}px;top:${top}px" title="${tip}">${esc(it.label)}</div>`);
    }).join("");
    const k = cnt(p);
    const h = Math.max(1, lanes.length) * 25 + 16;
    return `<div class="gt-row"><div class="gt-name">${esc(coName(p.coId))}
      <span class="sub2">${esc(p.period || tplName(p.tplId))} · ${k.pct}%</span></div>
      <div class="gt-track" style="height:${h}px;width:${W}px">${grid}<div class="gt-today" style="left:${todayX}px"></div>${bars}</div></div>`;
  }).join("");

  $("#dashBody").innerHTML = `<div class="card">
    <div class="card-h"><h3>타임라인</h3>
      <span style="margin-left:auto;font-size:11.5px;color:var(--muted)">월 단위 · 막대 = 시작일~종료일 · 붉은 세로선 = 오늘</span></div>
    <div class="gantt"><div style="min-width:${W + 178}px">
      <div class="gt-row gt-head"><div class="gt-name">프로젝트</div>
        <div class="gt-track" style="width:${W}px;height:32px">${head}<div class="gt-today" style="left:${todayX}px"></div></div></div>
      ${rows}</div></div></div>`;
}

function dashBoard(){

  visProjects().forEach(p => running(p).forEach(s => {
    const os = ownersOf(s); (os.length ? os : ["미지정"]).forEach(o => (byOwner[o] = byOwner[o] || []).push({p, s}));
  }));
  const cols = Object.entries(byOwner).sort((a, b) => b[1].length - a[1].length);
  if (!cols.length){ $("#dashBody").innerHTML = `<div class="card"><div class="empty"><strong>진행중인 단계가 없습니다</strong></div></div>`; return; }
  $("#dashBody").innerHTML = `<div class="board">${cols.map(([o, arr]) => {
    const late = arr.filter(x => isLate(x.s)).length;
    const cards = arr.sort((a, b) => (dueOf(a.s) || "9999").localeCompare(dueOf(b.s) || "9999")).map(({p, s}) => {
      const d = ddText(s), sd = staleDays(s), others = ownersOf(s).filter(x => x !== o);

        <div class="s">${esc(s.name)}</div>
        <div class="m"><span class="dd ${d.c}">${d.t}</span><span class="mono" style="color:var(--muted)">${esc(periodText(s))}</span>
          ${others.length ? `<span class="sub2">+${esc(others.join("·"))}</span>` : ""}
          ${sd !== null && sd >= STALE_DAYS ? `<span class="tag stale" style="margin-left:auto">${sd}일째</span>` : ""}</div></button>`;
    }).join("");
    return `<div class="bcol"><h4>${esc(o)}${late ? ` <span class="tag late">지연 ${late}</span>` : ""}<span class="c">${arr.length}건</span></h4>

}

let repMode = "cat";   // cat = 구분별 / co = 회사별
function dashReport(){

  const tot = {all:0, done:0, doing:0, late:0};
  const agg = list => { const t = {all:0, done:0, doing:0, late:0}; list.forEach(p => { const c = cnt(p); t.all += c.all; t.done += c.done; t.doing += c.doing; t.late += c.late; }); return t; };
  ps.forEach(p => { const c = cnt(p); tot.all += c.all; tot.done += c.done; tot.doing += c.doing; tot.late += c.late; });
  const pct = t => t.all ? Math.round(t.done / t.all * 100) : 0;

  const filt = [dash.co ? coName(dash.co) : "전체 회사", dash.cat || "전체 구분", hideDone ? "완료 프로젝트 제외" : ""].filter(Boolean).join(" · ");
  $("#dashBody").innerHTML = `
    <div class="no-print" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <div class="seg" id="repSeg"><button class="${repMode === "cat" ? "on" : ""}" data-m="cat">구분별</button><button class="${repMode === "co" ? "on" : ""}" data-m="co">회사별</button></div>
      <span class="sub" style="font-size:12px;color:var(--muted)">회사·구분 필터는 상단에서 지정 · <i>기울임</i> = 비고의 "예정: ○월"을 해석한 임시 일정</span>
      <div style="margin-left:auto;display:flex;gap:8px"><button class="btn" id="repXlsx">보고서 엑셀</button><button class="btn primary" id="repPrint">인쇄 · PDF 저장</button></div>
    </div>
    <div class="rep">
      <div class="rep-h"><h3>프로젝트 진행현황 보고</h3>
        <div class="meta">기준일 ${today}<br>${esc(filt)} · 프로젝트 ${ps.length}건</div></div>
      <div class="rep-sec">1. 요약</div>
      <table><thead><tr><th>${repMode === "co" ? "회사" : "구분"}</th><th class="rn">프로젝트</th><th class="rn">전체단계</th><th class="rn">완료</th><th class="rn">진행중</th><th class="rn">지연</th><th class="rn">진행률</th></tr></thead>
        <tbody>${sumRows}</tbody></table>
      <div class="rep-sec">2. 프로젝트별 진행현황 및 향후 계획</div>
      ${grpHtml || `<div class="empty">표시할 프로젝트가 없습니다.</div>`}
      <div class="rep-sec">3. 향후 일정 (일정순)</div>
      ${up.length ? `<table><thead><tr><th>일정</th><th>회사</th><th>구분 · 기수</th><th>단계</th><th>상태</th><th>담당</th></tr></thead><tbody>${upRows}</tbody></table>`
                  : `<div class="sub2">일정이 지정된 향후 단계가 없습니다.</div>`}
    </div>`;
  $$("#repSeg button").forEach(b => b.onclick = () => { repMode = b.dataset.m; dashReport(); });
  $("#repPrint").onclick = () => window.print();
  $("#repXlsx").onclick = () => exportReport(ps, groups, up);
}

    a2.push([catLabel(p), coName(p.coId), p.period || "", tplName(p.tplId), k.all ? k.done / k.all : 0, `${k.done}/${k.all}`,
      runs.map(s => s.name).join(", "), next ? next.name : (runs.length ? "" : "완료"), sc ? (sc.start === sc.end ? sc.start : sc.start + " ~ " + sc.end) : "",
      sc ? (sc.tent ? "예정(임시)" : "확정") : "", projOwners(p).join(", "), k.late, memo]);
    meta2.push({late:k.late}); });
  const ws2 = mkSheet(a2, (R, C) => C === 1 ? ST.co : C === 4 ? ST.pct : (C === 5 || C === 8 || C === 9) ? ST.center : C === 11 ? (meta2[R - 1].late ? ST.late : ST.center) : ST.base,
    [{wch:14},{wch:14},{wch:18},{wch:18},{wch:8},{wch:9},{wch:28},{wch:24},{wch:22},{wch:10},{wch:30},{wch:6},{wch:36}]);
  XLSX.utils.book_append_sheet(wb, ws2, "프로젝트현황"); sheets.push(2);
  /* 3) 단계별 상세 (모든 단계) */

  const meta3 = [];
  ps.forEach(p => (p.steps || []).forEach((s, i) => { const sc = schedOf(s);
    a3.push([catLabel(p), coName(p.coId), p.period || "", i + 1, s.name, S[stOf(s)], sc ? sc.start : "", sc ? sc.end : "",
      sc ? (sc.tent ? "예정(임시)" : "확정") : "", ddText(s).t, ownersOf(s).join(", "), s.memo || ""]); meta3.push(s); }));
  const ws3 = mkSheet(a3, (R, C) => C === 1 ? ST.co : C === 5 ? cellStyle(meta3[R - 1]) : (C === 3 || C === 6 || C === 7 || C === 8) ? ST.center : C === 9 ? (isLate(meta3[R - 1]) ? ST.late : ST.center) : ST.base,

  const meta4 = [];

  XLSX.utils.book_append_sheet(wb, ws4, "향후일정"); sheets.push(3);
  /* 5) 월별 인원 배정 */
  const months = [];
  up.forEach(({sc}) => { for (let d = new Date(toD(sc.start).getFullYear(), toD(sc.start).getMonth(), 1); d <= toD(sc.end); d.setMonth(d.getMonth() + 1)){
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); if (!months.includes(k)) months.push(k); } });
  months.sort();
  if (months.length){
    const a5 = [["담당자"].concat(months.map(m => m.slice(2).replace("-", "년 ") + "월"))];
    const names = DB.members.slice(); up.forEach(({s}) => ownersOf(s).forEach(o => { if (!names.includes(o)) names.push(o); })); names.push("미배정");
    names.forEach(n => { const row = [n]; months.forEach(m => {
      const items = up.filter(({s, sc}) => (ownersOf(s).includes(n) || (n === "미배정" && !ownersOf(s).length)) && sc.start.slice(0, 7) <= m && sc.end.slice(0, 7) >= m)
        .map(({p, s, sc}) => coName(p.coId) + " " + s.name + (sc.tent ? "(예정)" : ""));
      row.push(items.join("\n")); }); if (row.slice(1).some(Boolean)) a5.push(row); });
    const ws5 = mkSheet(a5, (R, C) => C === 0 ? ST.co : {font:{sz:10}, alignment:{vertical:"top", wrapText:true}, border:BD},
      [{wch:12}].concat(months.map(() => ({wch:34}))));
    XLSX.utils.book_append_sheet(wb, ws5, "월별인원배정"); sheets.push(1);
  }
  writeWb(wb, "진행현황보고_" + todayStr().replace(/-/g, "") + ".xlsx", sheets);
}

/* ===== 캘린더 ===== */
let calYm = null, calOwners = new Set(), calTent = true;
function calEvents(){
  const evs = [];
  visProjects().forEach(p => (p.steps || []).forEach(s => {
    const sc = schedOf(s); if (!sc || (sc.tent && !calTent)) return;
    const os = ownersOf(s);
    if (calOwners.size && !(os.some(o => calOwners.has(o)) || (calOwners.has("__none") && !os.length))) return;
    evs.push({p, s, start:sc.start, end:sc.end, tent:sc.tent, late:isLate(s), st:stOf(s)});
  }));
  return evs;
}
function dashCal(){
  if (!calYm){ const t = new Date(); calYm = {y:t.getFullYear(), m:t.getMonth()}; }
  const {y, m} = calYm, today = todayStr();
  const last = new Date(y, m + 1, 0), gridStart = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const weeks = [];
  for (let d = new Date(gridStart); d <= last; d.setDate(d.getDate() + 7))
    weeks.push(Array.from({length:7}, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return x; }));
  const evs = calEvents();
  const coIdx = {}; DB.companies.forEach((c, i) => coIdx[c.id] = i);
  const monthEvs = evs.filter(e => e.start <= fromD(last) && e.end >= fromD(new Date(y, m, 1)));

  const weekHtml = weeks.map(days => {
    const ws = fromD(days[0]), we = fromD(days[6]);
    const segs = evs.filter(e => e.start <= we && e.end >= ws).map(e => ({e,
      a:e.start < ws ? 0 : diffDays(e.start, ws), b:e.end > we ? 6 : diffDays(e.end, ws)}))
      .sort((p, q) => p.a - q.a || (q.b - q.a) - (p.b - p.a) || coName(p.e.p.coId).localeCompare(coName(q.e.p.coId)));
    const lanes = [];
    segs.forEach(sg => { let li = lanes.findIndex(v => v < sg.a); if (li === -1){ lanes.push(sg.b); li = lanes.length - 1; } else lanes[li] = sg.b; sg.lane = li; });
    const h = Math.max(88, 26 + lanes.length * 23 + 6);
    const cells = days.map(d => { const ds = fromD(d);
      const cls = ["cal-d", d.getMonth() !== m ? "out" : "", (d.getDay() === 0 || d.getDay() === 6) ? "we" : "", ds === today ? "today" : ""].join(" ");

      <td style="font-weight:600;white-space:nowrap">${esc(coName(e.p.coId))}</td><td class="sub2">${esc(catLabel(e.p))}${e.p.period ? " · " + esc(e.p.period) : ""}</td>
      <td>${esc(e.s.name)}</td><td><span class="badge ${e.st}">${S[e.st]}</span>${e.late ? ` <span class="tag late">지연</span>` : ""}</td>
      <td>${esc(ownersOf(e.s).join(", ")) || `<span class="sub2">미배정</span>`}</td><td class="sub2">${esc(e.s.memo || "")}</td></tr>`).join("");

  $("#dashBody").innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="card-h cal-tools no-print">
        <button class="btn sm" id="calPrev">◀</button><span class="cal-ym">${y}년 ${m + 1}월</span><button class="btn sm" id="calNext">▶</button>
        <button class="btn sm" id="calToday">오늘</button>
        <div class="chips" id="calOwn" style="flex-wrap:wrap;margin-left:8px">${chips}</div>
        <label style="margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px"><input type="checkbox" id="calTent" ${calTent ? "checked" : ""}> 임시일정 표시</label>
        <button class="btn sm" id="calPrint">인쇄</button>
      </div>
      <div class="card-b" style="padding:14px 16px">
        <div class="rep-h" style="display:none"></div>
        <div style="font-size:15px;font-weight:800;margin-bottom:10px">${y}년 ${m + 1}월 일정 <span class="sub2" style="font-weight:500">· ${dash.co ? esc(coName(dash.co)) : "전체 회사"} · ${esc(dash.cat || "전체 구분")}${calOwners.size ? " · 담당 " + esc([...calOwners].map(o => o === "__none" ? "미배정" : o).join(", ")) : ""}</span></div>
        <div class="cal">

          ${weekHtml}

    </div>
    <div class="card"><div class="card-h"><h3>이달 일정 목록</h3><span style="margin-left:auto;font-size:11.5px;color:var(--muted)">${monthEvs.length}건</span></div>
      ${monthEvs.length ? `<div class="tbl-wrap"><table><thead><tr><th>일정</th><th>회사</th><th>구분 · 기수</th><th>단계</th><th>상태</th><th>담당</th><th>비고</th></tr></thead><tbody>${listRows}</tbody></table></div>`

  $("#calNext").onclick = () => { calYm = {y:m === 11 ? y + 1 : y, m:m === 11 ? 0 : m + 1}; dashCal(); };

/* ===== 담당자 선택 팝오버 (다중 선택) ===== */
let popTarget = null, ownClip = null;
function ownLabel(list){ return list.length ? list.join(", ") : "담당자 –"; }
function ownBtn(s, key){
  const os = ownersOf(s);
  return `<button type="button" class="own ${os.length ? "" : "none"}" data-own="${key}" title="${esc(ownLabel(os))}">${esc(ownLabel(os))}</button>`;
}
function closePop(){ const p = $("#ownPop"); if (p) p.remove(); popTarget = null; }

function openPop(btn){
  closePop();
  const [pid, sid] = btn.dataset.own.split("|");
  const p = projOf(pid); if (!p) return;
  const st = (p.steps || []).find(x => x.id === sid); if (!st) return;
  const cur = ownersOf(st);

  const pop = document.createElement("div");
  pop.id = "ownPop";
  pop.innerHTML = DB.members.length
    ? `<div class="pop-h">여러 명 선택할 수 있습니다</div>`
      + `<div class="pop-b">${DB.members.map(m =>
          `<label><input type="checkbox" value="${esc(m)}" ${cur.includes(m) ? "checked" : ""}><span>${esc(m)}</span></label>`).join("")}</div>`
      + `<div class="pop-f alt">
           <button type="button" data-copy title="이 담당자 구성을 복사">복사</button>
           <button type="button" data-paste ${ownClip ? "" : "disabled"} title="${ownClip ? esc(ownLabel(ownClip)) : "복사된 담당자 없음"}">붙여넣기</button>
           <button type="button" data-below title="이 단계 아래 모든 단계에 동일 적용">아래 전체</button>
         </div>`
      + `<div class="pop-f"><button type="button" data-clear>모두 해제</button><button type="button" data-close>완료</button></div>`
    : `<div class="none">기준정보 탭에서 담당자를 먼저 등록하세요.</div>`;
  document.body.appendChild(pop);

  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px";
  pop.style.top = (r.bottom + 6 + h > window.innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";

  const key = btn.dataset.own;
  const curList = () => Array.from(pop.querySelectorAll("input[type=checkbox]")).filter(c => c.checked).map(c => c.value);
  const setChecks = list => pop.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = list.includes(c.value));
  const apply = () => {
    const list = curList();
    const [pid2, sid2] = key.split("|");
    const pr = projOf(pid2); if (!pr) return;
    const step = (pr.steps || []).find(x => x.id === sid2); if (!step) return;
    step.owners = list; save();
    const live = document.querySelector('[data-own="' + key + '"]');
    if (live){
      live.textContent = ownLabel(list);
      live.title = ownLabel(list);
      live.classList.toggle("none", !list.length);
    }
  };
  pop.addEventListener("click", e => e.stopPropagation());
  pop.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.onchange = apply;
    cb.onclick = () => setTimeout(apply, 0);
  });
  pop.querySelectorAll("label").forEach(l => { l.onclick = () => setTimeout(apply, 0); });

  const q = s => pop.querySelector(s);
  const cp = q("[data-copy]"), ps = q("[data-paste]"), bl = q("[data-below]"),
        cl = q("[data-clear]"), cd = q("[data-close]");
  if (cp) cp.onclick = () => {
    ownClip = curList();
    if (ps){ ps.disabled = false; ps.title = ownLabel(ownClip); }
    toast(ownClip.length ? "복사됨: " + ownLabel(ownClip) : "빈 담당자로 복사됨");
  };
  if (ps) ps.onclick = () => { if (!ownClip) return; setChecks(ownClip); apply(); };
  if (bl) bl.onclick = () => {
    const list = curList();
    const [pid2, sid2] = key.split("|");
    const pr = projOf(pid2); if (!pr) return;
    const idx = (pr.steps || []).findIndex(x => x.id === sid2);
    const n = pr.steps.length - idx - 1;
    if (n <= 0){ toast("아래에 단계가 없습니다"); return; }
    if (!confirm(`아래 ${n}개 단계의 담당자를 [${ownLabel(list)}](으)로 바꿀까요?`)) return;
    pr.steps.slice(idx + 1).forEach(s => s.owners = list.slice());
    save(true); closePop(); render(); toast(`아래 ${n}개 단계에 적용됨`);
  };
  if (cl) cl.onclick = () => { setChecks([]); apply(); };
  if (cd) cd.onclick = () => { apply(); closePop(); render(); };
  popTarget = btn;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-own]");
  if (b){ e.preventDefault(); e.stopPropagation(); popTarget === b ? closePop() : openPop(b); return; }
  if (!e.target.closest("#ownPop")) closePop();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
window.addEventListener("resize", closePop);

/* ===== 진행표 ===== */
function flatRows(useFilter){
  const out = [];
  visProjects().forEach(p => (p.steps || []).forEach((s, i) => {
    const os = ownersOf(s);
    const r = {p, s, no:i + 1, co:coName(p.coId), period:p.period || "", tpl:p.tplId || "",
               status:stOf(s), owners:os, late:isLate(s), stale:staleDays(s), key:p.id + "|" + s.id};
    if (useFilter){
      if (filters.co && p.coId !== filters.co) return;
      if (filters.tpl && (filters.tpl === "__none" ? (p.tplId || "") !== "" : (p.tplId || "") !== filters.tpl)) return;
      if (filters.cat && catLabel(p) !== filters.cat) return;
      if (!filters.status[r.status]) return;
      if (filters.lateOnly && !r.late) return;
      if (filters.owner === "__none" ? os.length : (filters.owner && !os.includes(filters.owner))) return;
      if (filters.key && !((s.name + " " + (s.memo || "")).toLowerCase().includes(filters.key.toLowerCase()))) return;
    }
    out.push(r);
  }));
  if (useFilter && filters.sort === "due")
    out.sort((a, b) => (dueOf(a.s) || "9999-99-99").localeCompare(dueOf(b.s) || "9999-99-99") || a.co.localeCompare(b.co));
  return out;
}

function renderTable(){
  $("#fCo").innerHTML = `<option value="">전체 회사</option>` + DB.companies.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#fCo").value = filters.co;
  { const cats = catList(); if (DB.projects.some(p => !catOf(p))) cats.push("미분류");
    $("#fCat").innerHTML = `<option value="">전체 구분</option>` + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    $("#fCat").value = cats.includes(filters.cat) ? filters.cat : (filters.cat = ""); }
  $("#fTpl").innerHTML = `<option value="">전체 절차</option><option value="__none">절차 미지정</option>` +
    DB.templates.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
  $("#fTpl").value = filters.tpl;
  $("#fOwner").innerHTML = `<option value="">전체 담당자</option><option value="__none">미지정</option>` +
    DB.members.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  $("#fOwner").value = filters.owner;

  const rows = flatRows(true);
  const keys = new Set(rows.map(r => r.key));
  picked = new Set(Array.from(picked).filter(k => keys.has(k)));

  $("#bigTbl").innerHTML = `
    <thead><tr>
      <th style="width:30px"><input type="checkbox" id="chkAll"></th>
      <th style="width:150px">프로젝트</th><th style="width:34px">순번</th><th style="min-width:190px">절차단계</th>
      <th style="width:116px">시작일</th><th style="width:116px">종료일</th><th style="width:58px">D-day</th>
      <th style="width:92px">상태</th><th style="width:130px">담당자</th><th style="min-width:170px">비고</th>
    </tr></thead>
    <tbody>${rows.length ? rows.map(r => `
      <tr data-k="${r.key}" class="${picked.has(r.key) ? "sel" : ""}">
        <td><input type="checkbox" class="rowchk" data-k="${r.key}" ${picked.has(r.key) ? "checked" : ""}></td>
        <td class="co">${esc(r.co)}<br><span class="sub2">${esc(r.period || tplName(r.tpl))}</span></td>
        <td class="num">${String(r.no).padStart(2, "0")}</td>
        <td><input class="cell-in" type="text" data-e="name" data-k="${r.key}" value="${esc(r.s.name)}">
          ${r.stale !== null && r.stale >= STALE_DAYS ? `<span class="tag stale">${r.stale}일째</span>` : ""}</td>
        <td><input class="cell-in" type="date" data-e="start" data-k="${r.key}" value="${esc(r.s.start || "")}"></td>
        <td><input class="cell-in" type="date" data-e="end" data-k="${r.key}" value="${esc(r.s.end || "")}"></td>
        <td class="ddcell"><span class="dd ${ddText(r.s).c}">${ddText(r.s).t}</span></td>
        <td><select class="st ${r.status}" data-e="status" data-k="${r.key}">
          ${Object.keys(S).map(v => `<option value="${v}" ${r.status === v ? "selected" : ""}>${S[v]}</option>`).join("")}</select></td>
        <td>${ownBtn(r.s, r.key)}</td>
        <td><input class="cell-in" type="text" data-e="memo" data-k="${r.key}" value="${esc(r.s.memo || "")}" placeholder="–"></td>
      </tr>`).join("") : `<tr><td colspan="10"><div class="empty">조건에 맞는 단계가 없습니다.</div></td></tr>`}
    </tbody>`;
  wireTable();
  renderBulk();
}

const findStep = key => { const [pid, sid] = key.split("|"); const p = projOf(pid); if (!p) return [null, null];
  return [p, (p.steps || []).find(s => s.id === sid) || null]; };

function refreshRow(key){
  const [, s] = findStep(key); if (!s) return;
  const tr = document.querySelector(`tr[data-k="${key}"]`); if (!tr) return;
  const d = ddText(s);
  tr.querySelector(".ddcell").innerHTML = `<span class="dd ${d.c}">${d.t}</span>`;
  const sel = tr.querySelector("select[data-e='status']");
  if (sel){ sel.className = "st " + stOf(s); }
}

function wireTable(){
  $$("#bigTbl input.cell-in").forEach(el => {
    const ev = el.type === "date" ? "change" : "input";
    el.addEventListener(ev, () => {
      const [, s] = findStep(el.dataset.k); if (!s) return;
      s[el.dataset.e] = el.value;
      if (el.dataset.e === "end" && s.start && s.end && s.start > s.end){ s.start = s.end;
        const si = document.querySelector(`input[data-e="start"][data-k="${el.dataset.k}"]`); if (si) si.value = s.start; }
      if (el.dataset.e === "start" && s.start && s.end && s.start > s.end){ s.end = s.start;
        const ei = document.querySelector(`input[data-e="end"][data-k="${el.dataset.k}"]`); if (ei) ei.value = s.end; }
      save(el.type === "date"); refreshRow(el.dataset.k);
    });
  });
  $$("#bigTbl select[data-e='status']").forEach(el => el.onchange = () => {
    const [, s] = findStep(el.dataset.k); if (!s) return;
    setStatus(s, el.value); save(true); refreshRow(el.dataset.k);
  });
  $$("#bigTbl .rowchk").forEach(cb => cb.onchange = () => {
    cb.checked ? picked.add(cb.dataset.k) : picked.delete(cb.dataset.k);
    const tr = cb.closest("tr"); tr.classList.toggle("sel", cb.checked);
    renderBulk();
  });
  const all = $("#chkAll");
  if (all) all.onchange = () => {
    $$("#bigTbl .rowchk").forEach(cb => { cb.checked = all.checked;
      cb.checked ? picked.add(cb.dataset.k) : picked.delete(cb.dataset.k);
      cb.closest("tr").classList.toggle("sel", cb.checked); });
    renderBulk();
  };
}

function setStatus(s, v){
  const now = todayStr();
  s.status = v;
  if (v === "doing" && !isDate(s.startedAt)) s.startedAt = now;
  if (v === "done"){ if (!isDate(s.startedAt)) s.startedAt = now; s.doneAt = now; }
  if (v === "todo"){ delete s.startedAt; delete s.doneAt; }
}

/* ----- 일괄 편집 바 ----- */
function renderBulk(){
  let bar = $("#bulk");
  if (!picked.size){ if (bar) bar.remove(); return; }
  if (!bar){ bar = document.createElement("div"); bar.id = "bulk"; document.body.appendChild(bar); }
  bar.innerHTML = `
    <span class="cntx">${picked.size}건 선택</span>
    <select id="bStatus"><option value="">상태 일괄…</option>${Object.keys(S).map(v => `<option value="${v}">${S[v]}</option>`).join("")}</select>
    <select id="bOwner"><option value="">담당자…</option>${DB.members.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("")}</select>
    <button class="btn sm" id="bAdd">추가</button><button class="btn sm" id="bSet">교체</button>
    <select id="bDateF"><option value="end">종료일</option><option value="start">시작일</option></select>
    <input id="bDate" type="date" style="width:140px"><button class="btn sm" id="bDateGo">지정</button>
    <input id="bShift" type="number" placeholder="±일" style="width:74px"><button class="btn sm" id="bShiftGo">이동</button>
    <button class="btn sm ghost" id="bDel">삭제</button>
    <button class="btn sm" id="bClear">해제</button>`;

  const each = fn => { picked.forEach(k => { const [, s] = findStep(k); if (s) fn(s, k); }); save(true); renderTable(); };
  $("#bStatus").onchange = e => { if (!e.target.value) return; const v = e.target.value; each(s => setStatus(s, v)); toast(`${picked.size}건 상태 변경`); };
  $("#bAdd").onclick = () => { const o = $("#bOwner").value; if (!o) return toast("담당자를 고르세요");
    each(s => { const l = ownersOf(s); if (!l.includes(o)) l.push(o); s.owners = l; }); };
  $("#bSet").onclick = () => { const o = $("#bOwner").value; if (!o) return toast("담당자를 고르세요"); each(s => { s.owners = [o]; }); };
  $("#bDateGo").onclick = () => { const v = $("#bDate").value, f = $("#bDateF").value; if (!v) return toast("날짜를 고르세요");
    each(s => { s[f] = v; if (s.start && s.end && s.start > s.end) (f === "end" ? s.start = v : s.end = v); }); };
  $("#bShiftGo").onclick = () => { const n = parseInt($("#bShift").value, 10); if (isNaN(n) || !n) return toast("이동할 일수를 입력하세요");
    each(s => { if (isDate(s.start)) s.start = addDays(s.start, n); if (isDate(s.end)) s.end = addDays(s.end, n); }); toast(`${n > 0 ? "+" : ""}${n}일 이동`); };
  $("#bDel").onclick = () => {
    if (!confirm(`선택한 ${picked.size}건의 단계를 삭제할까요?`)) return;
    picked.forEach(k => { const [p, s] = findStep(k); if (p && s) p.steps = p.steps.filter(x => x.id !== s.id); });
    picked.clear(); save(true); renderTable(); toast("삭제되었습니다");
  };
  $("#bClear").onclick = () => { picked.clear(); renderTable(); };
}

$("#fCo").onchange = e => { filters.co = e.target.value; renderTable(); };
$("#fTpl").onchange = e => { filters.tpl = e.target.value; renderTable(); };
$("#fCat").onchange = e => { filters.cat = e.target.value; renderTable(); };

    <div class="card">

            return `<tr>

          <input id="newStepE" class="fld" type="date" style="width:145px" title="종료일">
          <button id="addStep" class="btn primary">단계 추가</button>
        </div>
        <div class="hint">종료일만 입력하면 그날 하루짜리 일정으로 표시됩니다. 상태를 '진행중'으로 바꾸면 착수일이 기록되어 ${STALE_DAYS}일 이상 머물 때 정체 표시가 붙습니다.</div>
      </div>

}

function wireProj(p){
  const steps = p.steps || (p.steps = []);
  $("#projDetail").querySelectorAll("input.cell-in").forEach(el => {
    const ev = el.type === "date" ? "change" : "input";
    el.addEventListener(ev, () => {
      const s = steps[+el.dataset.i];
      s[el.dataset.f] = el.value;
      if (s.start && s.end && s.start > s.end){ el.dataset.f === "end" ? s.start = s.end : s.end = s.start; }
      save(el.type === "date");
      if (el.type === "date") renderProj();
    });
  });
  $("#projDetail").querySelectorAll("select[data-f='status']").forEach(el => el.onchange = () => {
    setStatus(steps[+el.dataset.i], el.value); save(true); renderProj();
  });
  $("#projDetail").querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, j = b.dataset.mv === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= steps.length) return;
    [steps[i], steps[j]] = [steps[j], steps[i]]; save(true); renderProj();
  });
  $("#projDetail").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const i = +b.dataset.del;
    if (!confirm(`「${steps[i].name}」 단계를 삭제할까요?`)) return;
    steps.splice(i, 1); save(true); renderProj();
  });
  const add = () => {
    const n = $("#newStep").value.trim(); if (!n) return;
    steps.push({id:uid8(), name:n, start:$("#newStepS").value || "", end:$("#newStepE").value || "", status:"todo", owners:[], memo:""});
    save(true); renderProj();
  };
  $("#addStep").onclick = add;
  $("#newStep").onkeydown = e => { if (e.key === "Enter") add(); };
  $("#pTpl").onchange = e => { p.tplId = e.target.value; save(true); renderProj(); };
  $("#pCat").onchange = e => { p.cat = e.target.value; save(true); renderProj(); };
  $("#pPeriod").onclick = () => { const v = prompt("기수 (예: 26Q2 반기, 26기말)", p.period || ""); if (v === null) return;
    p.period = v.trim(); save(true); renderProj(); };
  $("#pDel").onclick = () => {
    if (!confirm(`「${projTitle(p)}」 프로젝트를 삭제할까요?`)) return;
    DB.projects = DB.projects.filter(x => x.id !== p.id); selProj = null; save(true); renderProj();
  };
  $("#pLoad").onclick = () => {
    const t = tplOf(p.tplId);
    if (!t){ toast("먼저 절차 템플릿을 지정하세요"); return; }
    const base = prompt(`「${t.name}」 기준일 (YYYY-MM-DD)\n각 단계 일정 = 기준일 + 시작(D+) / 기간(일)`, todayStr());
    if (base === null) return;
    if (!isDate(base)){ toast("YYYY-MM-DD 형식으로 입력하세요"); return; }
    const keep = steps.length ? confirm(`기존 ${steps.length}개 단계를 유지하고 뒤에 추가할까요?\n[확인] 뒤에 추가  /  [취소] 교체`) : true;
    const fresh = buildSteps(t, base);
    p.steps = keep ? steps.concat(fresh) : fresh;
    save(true); renderProj(); toast(`「${t.name}」 적용됨`);
  };
  $("#pClone").onclick = () => {
    const period = prompt("새 기수 이름 (예: 26기말)", "");
    if (period === null) return;
    const shift = prompt("일정을 며칠 이동할까요? (예: 182 = 반년 뒤 / 비우면 일정 없이 복제)", "182");
    if (shift === null) return;
    const n = parseInt(shift, 10);
    const np = {id:uid8(), coId:p.coId, tplId:p.tplId, cat:p.cat || "", period:period.trim(),
      steps:steps.map(s => ({id:uid8(), name:s.name, owners:ownersOf(s).slice(), memo:"", status:"todo",
        start:(isDate(s.start) && !isNaN(n)) ? addDays(s.start, n) : "",
        end:(isDate(s.end) && !isNaN(n)) ? addDays(s.end, n) : ""}))};
    DB.projects.push(np); selProj = np.id; save(true); renderProj(); toast("새 기수로 복제되었습니다");
  };
}

const buildSteps = (t, base) => (t.steps || []).map(s => {
  const off = (s.offset === "" || s.offset === null || s.offset === undefined) ? null : Number(s.offset) || 0;
  const dur = (s.dur === "" || s.dur === null || s.dur === undefined) ? null : Math.max(1, Number(s.dur) || 1);
  const st = off === null ? "" : addDays(base, off);
  const en = off === null ? "" : addDays(base, off + (dur ? dur - 1 : 0));
  return {id:uid8(), name:s.name, start:st, end:en, status:"todo", owners:[], memo:""};
});

$("#addCo").onclick = () => {
  const n = $("#newCo").value.trim(); if (!n) return;
  DB.companies.push({id:uid8(), name:n}); $("#newCo").value = ""; save(true); renderProj(); toast("회사가 등록되었습니다");
};
$("#newCo").onkeydown = e => { if (e.key === "Enter") $("#addCo").click(); };
$("#addProj").onclick = () => {
  const coId = $("#npCo").value; if (!coId){ toast("회사를 먼저 등록하세요"); return; }
  const t = tplOf($("#npTpl").value);
  const base = $("#npBase").value || todayStr();
  const p = {id:uid8(), coId, tplId:t ? t.id : "", cat:"", period:$("#npPeriod").value.trim(), steps:t ? buildSteps(t, base) : []};
  DB.projects.push(p); selProj = p.id; $("#npPeriod").value = "";
  save(true); renderProj(); toast("프로젝트가 생성되었습니다");
};

/* ===== 기준정보 ===== */
function usedBy(name){
  let n = 0;
  DB.projects.forEach(p => (p.steps || []).forEach(s => { if (ownersOf(s).includes(name)) n++; }));
  return n;
}
function renderBase(){
  $("#memCount").textContent = DB.members.length + "명";
  $("#memList").innerHTML = DB.members.length
    ? DB.members.map((m, i) => `<div class="mem-item">${esc(m)}<span class="mini">${usedBy(m)}건</span>
        <button data-mren="${i}" title="이름변경">✎</button><button data-mdel="${i}" title="삭제">✕</button></div>`).join("")
    : `<div class="empty" style="padding:22px 16px">등록된 담당자가 없습니다.</div>`;
  $$("[data-mren]").forEach(b => b.onclick = () => {
    const i = +b.dataset.mren, old = DB.members[i], n = prompt("담당자 이름", old);
    if (!n || !n.trim() || n.trim() === old) return;
    const nv = n.trim();
    if (DB.members.includes(nv)){ toast("이미 있는 이름입니다"); return; }
    DB.members[i] = nv;
    DB.projects.forEach(p => (p.steps || []).forEach(s => { s.owners = ownersOf(s).map(o => o === old ? nv : o); }));
    if (filters.owner === old) filters.owner = nv;
    save(true); renderBase();
  });
  $$("[data-mdel]").forEach(b => b.onclick = () => {
    const i = +b.dataset.mdel, m = DB.members[i], n = usedBy(m);
    if (!confirm(n ? `「${m}」을(를) 명단에서 지울까요?\n배정된 ${n}건의 표시는 그대로 남습니다.` : `「${m}」을(를) 지울까요?`)) return;
    DB.members.splice(i, 1); save(true); renderBase();

    const nv = n.trim(); if (DB.cats.includes(nv)){ toast("이미 있는 구분입니다"); return; }
    DB.cats[i] = nv;
    DB.templates.forEach(t => { if (t.cat === old) t.cat = nv; });
    DB.projects.forEach(p => { if (p.cat === old) p.cat = nv; });
    save(true); renderBase();
  });
  $$("[data-cdel]").forEach(b => b.onclick = () => {
    const i = +b.dataset.cdel, c = DB.cats[i], n = catUse(c);
    if (!confirm(n ? `「${c}」 구분을 지울까요?\n이 구분의 프로젝트 ${n}건은 '미분류'가 됩니다.` : `「${c}」 구분을 지울까요?`)) return;

  $("#tplDetail").innerHTML = `
    <div class="card">
      <div class="card-h"><h3>${esc(t.name)}</h3>
        <select id="tCat" class="fld" style="width:auto;font-size:12px;padding:4px 8px" title="구분 (이 템플릿으로 만든 프로젝트의 기본 구분)">
          <option value="">구분 미지정</option>
          ${catList().map(c => `<option value="${esc(c)}" ${t.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
        </select>
        <span style="margin-left:auto;font-size:11.5px;color:var(--muted)">사용 중인 프로젝트 ${DB.projects.filter(p => p.tplId === t.id).length}건</span>
        <button class="btn sm" id="renameTpl">이름변경</button><button class="btn sm ghost" id="delTpl">삭제</button></div>

            <span class="sub2">일 시작 ·</span>
            <input class="cell-in" type="number" data-tf="dur" data-i="${i}" value="${esc(s.dur ?? "")}" placeholder="1" style="width:56px;font-family:var(--mono);text-align:right">

        <div class="addbar">
