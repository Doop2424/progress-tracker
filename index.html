    [steps[i], steps[j]] = [steps[j], steps[i]]; save(true); renderBase();
  });
  $("#tplDetail").querySelectorAll("[data-tdel]").forEach(b => b.onclick = () => { steps.splice(+b.dataset.tdel, 1); save(true); renderBase(); });
  const addT = () => {
    const n = $("#newTStep").value.trim(); if (!n) return;
    steps.push({id:uid8(), name:n, offset:$("#newTOff").value, dur:$("#newTDur").value});
    save(true); renderBase();
  };
  $("#addTStep").onclick = addT;
  $("#newTStep").onkeydown = e => { if (e.key === "Enter") addT(); };
  $("#renameTpl").onclick = () => { const n = prompt("템플릿명", t.name); if (n && n.trim()){ t.name = n.trim(); save(true); renderBase(); } };
  $("#tCat").onchange = e => { t.cat = e.target.value; save(true); renderBase(); };
  $("#delTpl").onclick = () => {
    const used = DB.projects.filter(p => p.tplId === t.id).length;
    if (!confirm(`「${t.name}」 템플릿을 삭제할까요?${used ? `\n사용 중인 프로젝트 ${used}건은 '절차 미지정'이 됩니다.` : ""}`)) return;
    DB.templates = DB.templates.filter(x => x.id !== t.id);
    DB.projects.forEach(p => { if (p.tplId === t.id) p.tplId = ""; });
    selTpl = null; save(true); renderBase();
  };
}
$("#addTpl").onclick = () => {
  const n = $("#newTpl").value.trim(); if (!n) return;
  const t = {id:uid8(), name:n, steps:[]}; DB.templates.push(t); selTpl = t.id; $("#newTpl").value = "";
  save(true); renderBase();
};
$("#newTpl").onkeydown = e => { if (e.key === "Enter") $("#addTpl").click(); };
$("#addCat").onclick = () => {
  const n = $("#newCat").value.trim(); if (!n) return;
  if ((DB.cats || []).includes(n)){ toast("이미 있는 구분입니다"); return; }
  (DB.cats = DB.cats || []).push(n); $("#newCat").value = ""; save(true); renderBase();
};
$("#newCat").onkeydown = e => { if (e.key === "Enter") $("#addCat").click(); };
$("#addMem").onclick = () => {
  const n = $("#newMem").value.trim(); if (!n) return;
  if (DB.members.includes(n)){ toast("이미 있는 이름입니다"); return; }
  DB.members.push(n); $("#newMem").value = ""; save(true); renderBase();
};
$("#newMem").onkeydown = e => { if (e.key === "Enter") $("#addMem").click(); };

/* ===== 엑셀 ===== */
const BD = {top:{style:"thin",color:{rgb:"D3DBE4"}}, bottom:{style:"thin",color:{rgb:"D3DBE4"}},
            left:{style:"thin",color:{rgb:"D3DBE4"}}, right:{style:"thin",color:{rgb:"D3DBE4"}}};
const ST = {
  hdr:{fill:{fgColor:{rgb:"1B4B7A"}}, font:{color:{rgb:"FFFFFF"}, bold:true, sz:10}, alignment:{horizontal:"center", vertical:"center"}, border:BD},
  base:{font:{sz:10}, alignment:{vertical:"center"}, border:BD},
  center:{font:{sz:10}, alignment:{horizontal:"center", vertical:"center"}, border:BD},
  co:{font:{sz:10, bold:true}, alignment:{vertical:"center"}, border:BD},
  todo:{fill:{fgColor:{rgb:"F2F4F7"}}, font:{color:{rgb:"6B7885"}, sz:10, bold:true}, alignment:{horizontal:"center", vertical:"center"}, border:BD},
  doing:{fill:{fgColor:{rgb:"FBF2E6"}}, font:{color:{rgb:"B96C15"}, sz:10, bold:true}, alignment:{horizontal:"center", vertical:"center"}, border:BD},
  done:{fill:{fgColor:{rgb:"EAF5EF"}}, font:{color:{rgb:"26714E"}, sz:10, bold:true}, alignment:{horizontal:"center", vertical:"center"}, border:BD},
  late:{fill:{fgColor:{rgb:"FDECE9"}}, font:{color:{rgb:"B3402F"}, sz:10, bold:true}, alignment:{horizontal:"center", vertical:"center"}, border:BD},
  na:{fill:{fgColor:{rgb:"FAFBFC"}}, font:{color:{rgb:"C3CBD5"}, sz:10}, alignment:{horizontal:"center", vertical:"center"}, border:BD},
  pct:{font:{sz:10, bold:true}, numFmt:"0%", alignment:{horizontal:"center", vertical:"center"}, border:BD}
};
const cellStyle = s => isLate(s) ? ST.late : ST[stOf(s)];

function mkSheet(aoa, styles, cols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const rng = XLSX.utils.decode_range(ws["!ref"]);
  for (let R = rng.s.r; R <= rng.e.r; R++)
    for (let C = rng.s.c; C <= rng.e.c; C++){
      const a = XLSX.utils.encode_cell({r:R, c:C});
      if (!ws[a]) ws[a] = {t:"s", v:""};
      ws[a].s = R === 0 ? ST.hdr : (styles(R, C) || ST.base);
    }
  ws["!cols"] = cols;
  ws["!rows"] = [{hpt:22}];
  ws["!autofilter"] = {ref:XLSX.utils.encode_range({s:{r:0,c:rng.s.c}, e:{r:0,c:rng.e.c}})};
  return ws;
}

function exportXlsx(useFilter){
  if (typeof XLSX === "undefined"){ toast("엑셀 라이브러리를 불러오지 못했습니다"); return; }
  const rows = flatRows(useFilter);
  if (!rows.length){ toast("추출할 데이터가 없습니다"); return; }
  const wb = XLSX.utils.book_new(), sheets = [];
  let src = visProjects();
  if (useFilter){
    if (filters.co) src = src.filter(p => p.coId === filters.co);
    if (filters.tpl) src = src.filter(p => filters.tpl === "__none" ? (p.tplId || "") === "" : (p.tplId || "") === filters.tpl);
  }

  /* 1) 프로젝트 요약 */
  const a1 = [["구분","회사","기수","절차","전체단계","완료","진행중","미착수","지연","진행률","진행중 단계(동시)","기간","가장 이른 기한"]];
  src.forEach(p => {
    const k = cnt(p), runs = running(p);
    const ds = (p.steps || []).map(s => s.start).filter(isDate).sort();
    const de = (p.steps || []).map(s => dueOf(s)).filter(isDate).sort();
    const next = (p.steps || []).filter(s => stOf(s) !== "done" && isDate(dueOf(s))).map(s => dueOf(s)).sort()[0] || "";
    a1.push([catLabel(p), coName(p.coId), p.period || "", tplName(p.tplId), k.all, k.done, k.doing, k.todo, k.late,
             k.all ? k.done / k.all : 0,
             runs.map(s => s.name + (ownersOf(s).length ? "(" + ownersOf(s).join("·") + ")" : "")).join(", "),
             (ds[0] || de[0] || "") + (de.length ? " ~ " + de[de.length - 1] : ""), next]);
  });
  const ws1 = mkSheet(a1, (R, C) => {
    if (C === 1) return ST.co;
    if (C === 9) return ST.pct;
    if (C === 8) return a1[R][8] > 0 ? ST.late : ST.center;
    if (C >= 4 && C <= 7) return ST.center;
    return ST.base;
  }, [{wch:14},{wch:16},{wch:14},{wch:20},{wch:9},{wch:7},{wch:8},{wch:8},{wch:7},{wch:9},{wch:40},{wch:24},{wch:13}]);
  XLSX.utils.book_append_sheet(wb, ws1, "프로젝트요약"); sheets.push(2);

  /* 2) 진행현황 */
  const a2 = [["구분","회사","기수","절차","순번","절차단계","시작일","종료일","D-day","상태","담당자","경과(진행중)","비고"]];
  rows.forEach(r => a2.push([catLabel(r.p), r.co, r.period, tplName(r.tpl), r.no, r.s.name, r.s.start || "", r.s.end || "",
    ddText(r.s).t, S[r.status], r.owners.join(", "), r.stale !== null ? r.stale + "일" : "", r.s.memo || ""]));
  const ws2 = mkSheet(a2, (R, C) => {
    const r = rows[R - 1];
    if (C === 1) return ST.co;
    if (C === 9) return cellStyle(r.s);
    if (C === 8) return r.late ? ST.late : ST.center;
    if (C === 4 || C === 6 || C === 7 || C === 11) return ST.center;
    return ST.base;
  }, [{wch:14},{wch:15},{wch:13},{wch:18},{wch:6},{wch:30},{wch:12},{wch:12},{wch:8},{wch:9},{wch:16},{wch:12},{wch:32}]);
  XLSX.utils.book_append_sheet(wb, ws2, "진행현황"); sheets.push(2);

  /* 3) 절차별 매트릭스 */
  const used = ["프로젝트요약", "진행현황"];
  const sheetName = base => {
    let n = String(base).replace(/[\[\]:*?\/\\]/g, " ").trim().slice(0, 28) || "매트릭스";
    let s = n, i = 2; while (used.includes(s)) s = n.slice(0, 26) + "_" + i++;
    used.push(s); return s;
  };
  groupByTpl(src).forEach(([tid, list]) => {
    const names = colsFor(tid, list); if (!names.length) return;
    const meta = [], a3 = [["회사","기수"].concat(names).concat(["진행률"])];
    list.forEach(p => {
      const by = {}; (p.steps || []).forEach(s => { if (!by[s.name]) by[s.name] = s; });
      const k = cnt(p);
      a3.push([coName(p.coId), p.period || ""].concat(names.map(n => {
        const s = by[n]; return s ? S[stOf(s)] + (dueOf(s) ? " " + md(dueOf(s)) : "") : "–";
      })).concat([k.all ? k.done / k.all : 0]));
      meta.push(by);
    });
    const ws3 = mkSheet(a3, (R, C) => {
      if (C === 0) return ST.co;
      if (C === 1) return ST.center;
      if (C === names.length + 2) return ST.pct;
      const s = meta[R - 1][names[C - 2]];
      return s ? cellStyle(s) : ST.na;
    }, [{wch:16},{wch:13}].concat(names.map(() => ({wch:13}))).concat([{wch:9}]));
    XLSX.utils.book_append_sheet(wb, ws3, sheetName(tid ? tplName(tid) : "절차미지정"));
    sheets.push(2);
  });

  writeWb(wb, "진행현황_" + todayStr().replace(/-/g, "") + ".xlsx", sheets);
}
/* 통합문서 저장 (시트별 틀고정 열 수 지정) */
function writeWb(wb, fname, sheets){
  const buf = XLSX.write(wb, {type:"array", bookType:"xlsx"});
  if (typeof JSZip === "undefined"){ dl(new Blob([buf]), fname); toast("엑셀 추출 완료 (틀고정 제외)"); return; }
  JSZip.loadAsync(buf).then(async zip => {
    for (let i = 0; i < sheets.length; i++){
      const path = "xl/worksheets/sheet" + (i + 1) + ".xml";
      const f = zip.file(path); if (!f) continue;
      let xml = await f.async("string");
      const x = sheets[i];
      const pane = `<sheetView workbookViewId="0"><pane xSplit="${x}" ySplit="1" `
        + `topLeftCell="${XLSX.utils.encode_cell({r:1, c:x})}" activePane="bottomRight" state="frozen"/>`
        + `<selection pane="bottomRight"/></sheetView>`;
      zip.file(path, xml.replace('<sheetView workbookViewId="0"/>', pane));
    }
    return zip.generateAsync({type:"blob", compression:"DEFLATE"});
  }).then(blob => { dl(blob, fname); toast("엑셀 추출 완료"); })
    .catch(() => { dl(new Blob([buf]), fname); toast("엑셀 추출 완료 (틀고정 제외)"); });
}
/* ===== 백업 / 복원 ===== */
$("#bkExport").onclick = () => {
  const data = {app:"progress-tracker", version:3, exportedAt:new Date().toISOString(),
    companies:DB.companies, projects:DB.projects, templates:DB.templates, members:DB.members, cats:DB.cats || []};
  dl(new Blob([JSON.stringify(data, null, 1)], {type:"application/json"}), "진행현황_백업_" + todayStr().replace(/-/g, "") + ".json");
  toast("백업 파일을 내려받았습니다");
};
$("#bkImport").onclick = () => { $("#bkFile").value = ""; $("#bkFile").click(); };
$("#bkFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch(_){ toast("JSON 파일을 읽을 수 없습니다"); return; }
    const ok = d && Array.isArray(d.companies) && Array.isArray(d.projects) && Array.isArray(d.templates);
    if (!ok){ toast("진행현황 백업 파일이 아닙니다"); return; }
    const cur = `현재: 회사 ${DB.companies.length} · 프로젝트 ${DB.projects.length} · 템플릿 ${DB.templates.length}`;
    const inc = `파일: 회사 ${d.companies.length} · 프로젝트 ${d.projects.length} · 템플릿 ${d.templates.length}${d.exportedAt ? " (" + d.exportedAt.slice(0, 16).replace("T", " ") + " 백업)" : ""}`;
    const mode = prompt(`${cur}\n${inc}\n\n1 = 전체 교체 (현재 데이터 삭제 후 파일로 대체)\n2 = 추가 병합 (파일에만 있는 회사·프로젝트·템플릿을 추가)\n취소 = 중단`, "1");
    if (mode !== "1" && mode !== "2") return;
    if (mode === "1"){
      if (!confirm("현재 데이터를 모두 지우고 파일 내용으로 교체합니다. 계속할까요?")) return;
      DB = {companies:d.companies, projects:d.projects, templates:d.templates, members:d.members || [], cats:d.cats || []};
    } else {
      const has = (arr, id) => arr.some(x => x.id === id);
      d.companies.forEach(c => { if (!has(DB.companies, c.id)) DB.companies.push(c); });
      d.templates.forEach(t => { if (!has(DB.templates, t.id)) DB.templates.push(t); });
      d.projects.forEach(p => { if (!has(DB.projects, p.id)) DB.projects.push(p); });
      (d.members || []).forEach(m => { if (!DB.members.includes(m)) DB.members.push(m); });
      (d.cats || []).forEach(c => { if (!(DB.cats = DB.cats || []).includes(c)) DB.cats.push(c); });
    }
    migrate(); selProj = null; selTpl = null; picked = new Set();
    save(true); render(); toast(mode === "1" ? "복원 완료 (전체 교체)" : "복원 완료 (추가 병합)");
  };
  rd.readAsText(f, "utf-8");
};

function dl(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$$("[data-export]").forEach(b => b.onclick = () => exportXlsx(b.dataset.export === "filtered"));
</script>
